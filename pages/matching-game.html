<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matching Game</title>
    <style>
      #leftSide,
      #rightSide {
        position: absolute;
        width: 500px;
        height: 500px;
      }
      #leftSide {
        left: 0;
        background: #f0f0f0;
      }
      #rightSide {
        left: 500px;
        border-left: 1px solid black;
        background: #f9f9f9;
      }
      .face {
        position: absolute;
        width: 48px;
        height: 48px;
        font-size: 40px;
        line-height: 48px;
        text-align: center;
        cursor: pointer;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <h1>Matching Game</h1>
    <p>Click on the extra smiling face on the left</p>
    <div id="leftSide"></div>
    <div id="rightSide"></div>

    <script>
      let numberOfFaces = 5;
      let gameActive = true;
      const leftSide = document.getElementById("leftSide");
      const rightSide = document.getElementById("rightSide");

      function clearFaces() {
        while (leftSide.firstChild) {
          leftSide.removeChild(leftSide.firstChild);
        }
        while (rightSide.firstChild) {
          rightSide.removeChild(rightSide.firstChild);
        }
      }

      function gameOver() {
        if (!gameActive) return;
        gameActive = false;
        alert("Game Over!");
        document.body.removeEventListener("click", gameOver);
      }

      function generateFaces() {
        clearFaces();

        for (let i = 0; i < numberOfFaces; i++) {
          const face = document.createElement("div");
          face.classList.add("face");
          face.textContent = "😊";
          face.style.top = Math.floor(Math.random() * 400) + "px";
          face.style.left = Math.floor(Math.random() * 400) + "px";
          leftSide.appendChild(face);
        }

        const leftClone = leftSide.cloneNode(true);
        leftClone.removeChild(leftClone.lastChild);
        while (leftClone.firstChild) {
          rightSide.appendChild(leftClone.firstChild);
        }

        const extraFace = leftSide.lastChild;
        extraFace.addEventListener("click", function (event) {
          if (!gameActive) return;
          event.stopPropagation();
          numberOfFaces += 5;
          generateFaces();
        });
      }

      document.body.addEventListener("click", gameOver);

      generateFaces();
    </script>
  </body>
</html>
