<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Guessing Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        transition: background 1s ease;
      }
      
      .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.95);
        padding: 3rem 2rem;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        width: 100%;
      }

      h1 {
        color: #667eea;
        font-size: 2.5rem;
        margin-bottom: 1rem;
        font-weight: 800;
      }

      .subtitle {
        color: #666;
        margin-bottom: 2rem;
        font-size: 1rem;
        line-height: 1.6;
      }

      .color-palette {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-bottom: 2rem;
        padding: 1.5rem;
        background: #f8f9fa;
        border-radius: 12px;
      }

      .color-chip {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        border: 3px solid #dee2e6;
        transition: transform 0.2s ease;
        cursor: default;
      }

      .color-chip:hover {
        transform: scale(1.1);
        border-color: #667eea;
      }

      .stats {
        display: flex;
        justify-content: space-around;
        margin-bottom: 2rem;
        padding: 1rem;
        background: #f8f9fa;
        border-radius: 12px;
      }

      .stat-box {
        text-align: center;
      }

      .stat-number {
        font-size: 2rem;
        font-weight: 800;
        color: #667eea;
      }

      .stat-label {
        font-size: 0.85rem;
        color: #666;
        font-weight: 600;
        margin-top: 0.25rem;
      }
      
      button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 16px 40px;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      
      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5);
      }
      
      button:active {
        transform: translateY(-1px);
      }

      .game-info {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #e7f3ff;
        border-radius: 8px;
        color: #004085;
        font-size: 0.9rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎨 Color Guessing Game</h1>
      <p class="subtitle">Can you guess which color I'm thinking of?</p>
      
      <div class="color-palette" id="colorPalette">
        <!-- Colors will be displayed here -->
      </div>

      <div class="stats">
        <div class="stat-box">
          <div class="stat-number" id="gamesPlayed">0</div>
          <div class="stat-label">Games Played</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="bestScore">-</div>
          <div class="stat-label">Best Score</div>
        </div>
      </div>

      <button type="button" onclick="runGame()">🎮 Start Game</button>

      <div class="game-info">
        💡 <strong>How to play:</strong> I'll think of a color from the palette above. Try to guess it! I'll give you hints if your guess is alphabetically higher or lower.
      </div>
    </div>

    <script>
      const COLORS_ARRAY = ["blue", "cyan", "gold", "gray", "green", "magenta", "orange", "red", "white", "yellow"]; 
      let gamesPlayed = 0;
      let bestScore = Infinity;

      // Display color palette
      function displayColors() {
        const palette = document.getElementById('colorPalette');
        palette.innerHTML = '';
        COLORS_ARRAY.forEach(color => {
          const chip = document.createElement('div');
          chip.className = 'color-chip';
          chip.style.backgroundColor = color;
          chip.title = color.charAt(0).toUpperCase() + color.slice(1);
          palette.appendChild(chip);
        });
      }

      function updateStats() {
        document.getElementById('gamesPlayed').textContent = gamesPlayed;
        document.getElementById('bestScore').textContent = bestScore === Infinity ? '-' : bestScore;
      }

      function runGame() { 
        let guess = "";
        let correct = false;
        let numTries = 0;

        // Randomly select a target color from the array
        const targetIndex = Math.floor(Math.random() * COLORS_ARRAY.length);
        const target = COLORS_ARRAY[targetIndex];
        console.log("Target is:", target);

        do {
          guess = prompt("I am thinking of one of these colors:\n\n" + COLORS_ARRAY.join(", ") + "\n\nWhat color am I thinking of?");
           
          // Exit the function if the user cancels the prompt
          if (guess === null) {
            alert("Game cancelled. Goodbye!");
            return;   
          }
            
          guess = guess.toLowerCase().trim();
          numTries++;

          // check the guess
          correct = checkGuess(guess, target);
        } while (!correct);
            
        alert("🎉 Congratulations! You correctly guessed the color " + target + "! It took you " + numTries + " tries.");
        document.body.style.background = target;

        // Update stats
        gamesPlayed++;
        if (numTries < bestScore) {
          bestScore = numTries;
        }
        updateStats();

        // Reset background after 3 seconds
        setTimeout(() => {
          document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        }, 3000);
      }

      function checkGuess(guess, target) { 
        let correct = false; 
    
        if (!COLORS_ARRAY.includes(guess)) {
          alert("❌ Sorry, that color is not in the list. Please try again.");
        } else if (guess > target) {
          alert("📉 Your guess is alphabetically higher than the answer. Try again!");
        } else if (guess < target) {
          alert("📈 Your guess is alphabetically lower than the answer. Try again!");
        } else {
          correct = true;
        }
         
        return correct;
      }

      // Initialize
      displayColors();
      updateStats();
    </script>
  </body>
</html>
